name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detector:
    name: Tests and key set (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: detector/uv.lock
          python-version: ${{ matrix.python }}
      - name: Lint
        if: matrix.python == '3.12'
        run: uvx ruff@0.12.8 check .
      - name: Format
        if: matrix.python == '3.12'
        run: uvx ruff@0.12.8 format --check .
      - name: Tests
        run: uv run --locked pytest
      - name: Published key set
        if: matrix.python == '3.12'
        run: uv run --locked python scripts/check_key_set.py
